# Config de TEST (mini-COCO synthétique, encodeur factice) — ne pas utiliser pour la vraie release
seed: 42
release_version: "g1-TEST"
paths: {raw: data_fake/raw, artifacts: artifacts_test}
sizes: {kb: 800, val: 60, test: 60}
captions_per_image: 5
sampling:
  min_objects: 1
  min_side_px: 200
  kb_min_images_per_category: 5
  eval_complexity_target: {simple: 0.25, medium: 0.30, complex: 0.30, crowded: 0.15}
  eval_min_interaction_frac: 0.30
  eval_min_context_frac: 0.20
image: {max_side: 512, jpeg_quality: 95, dhash_size: 8, near_dup_hamming: 4, night_brightness_thr: 0.28}
detector: {model: facebook/detr-resnet-50, conf_threshold: 0.7}
encoders:
  debug-hist: {type: debug, dim: 96}
  debug-hist2: {type: debug, dim: 48}
primary_encoder: debug-hist
sbert_model: sentence-transformers/all-MiniLM-L6-v2
index:
  type: flat_ip
  hnsw: {M: 16, efConstruction: 100, efSearch: 32}
tuning: {top_k: [1, 3, 5, 10]}
